services:
  shadow-gateway:
    build:
      context: .
      target: gateway-check
    image: autonomous-trading-gateway:local
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 128
    cpus: 1
    restart: unless-stopped
    command: [python, -m, trading_platform.gateways.ctrader.service, --credentials, /private/credentials.json, --tokens, /state/tokens.json, --account, "${CTRADER_DEMO_ACCOUNT:?set explicit demo account}", --state, /state/shadow.db, --feed-config, /private/feed.json]
    volumes:
      - "${SHADOW_SECRET_DIR:?set private credential/config directory}:/private:ro"
      - "${SHADOW_STATE_DIR:?set private UID10001 writable directory}:/state"
    networks: [egress]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  egress: {}
