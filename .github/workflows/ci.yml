name: Paper platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate and build Docker deployment
        run: |
          docker compose config --quiet
          python3 scripts/audit_compose.py
          docker compose build core tests
          docker build --target gateway-check -t trading-gateway-check .
      - name: Validate configuration and run container tests
        run: |
          docker compose --profile tools run --rm validate
          docker compose --profile tools run --rm tests
      - name: Gateway protocol and offline fault tests
        run: docker run --rm --network none --tmpfs /tmp -e HYPOTHESIS_STORAGE_DIRECTORY=/tmp/hypothesis trading-gateway-check
      - name: Isolated backup restore and measured paper soak
        run: |
          docker run --rm --network none --tmpfs /tmp trading-gateway-check python scripts/recovery_drill.py
          docker run --rm --network none --tmpfs /tmp trading-gateway-check python scripts/soak.py
      - name: Restart paper stack with open exposure
        run: python3 scripts/paper_smoke.py

  architecture-builds:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and run native architecture tests
        run: |
          docker build --platform ${{ matrix.platform }} --target gateway-check -t gateway-native .
          docker run --rm --network none --tmpfs /tmp -e HYPOTHESIS_STORAGE_DIRECTORY=/tmp/hypothesis gateway-native
