# One-shot scaffold validation. This is not a trading daemon.
services:
  validate:
    build: .
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    restart: "no"
  tests:
    build: .
    profiles: [tools]
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    restart: "no"
